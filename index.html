<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f6f8">
<title>نظام نقاط الكشافة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  /* brand */
  --crimson:#c1272d;
  --crimson-soft:#e8595e;
  --green:#1f7a4d;
  --green-soft:#e7f3ec;
  --gold:#b8862f;
  --gold-soft:#f6edd8;
  /* neutrals */
  --bg:#f5f6f8;
  --surface:#ffffff;
  --line:#e9ecf1;
  --line-strong:#dde1e8;
  --ink:#1c2230;
  --ink-soft:#5b6472;
  --ink-faint:#9aa2b1;
  --danger:#d64545;
  --ok:#1f9d57;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 1px 2px rgba(20,30,50,.04), 0 8px 24px rgba(20,30,50,.06);
  --shadow-lift:0 2px 4px rgba(20,30,50,.05), 0 16px 40px rgba(20,30,50,.10);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Tajawal',sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  padding:20px 18px 60px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Cairo',sans-serif; font-weight:800; letter-spacing:-.01em;}
.hidden{display:none !important;}
.wrap{max-width:1080px; margin:0 auto;}

/* ---- crest / topbar ---- */
.crest{
  width:104px; height:104px; border-radius:26px;
  background:var(--surface);
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 16px;
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.crest img{width:80%; height:80%; object-fit:contain;}
.topbar{
  text-align:center; padding:26px 10px 30px;
  margin-bottom:22px;
}
.topbar h1{font-size:27px; color:var(--ink);}
.topbar .sub{color:var(--gold); font-size:14px; margin-top:6px; font-weight:700;}
.topbar .sub-en{color:var(--ink-faint); font-size:10.5px; margin-top:3px; letter-spacing:2px; text-transform:uppercase; font-family:'Cairo',sans-serif; font-weight:600;}

/* ---- card (was .patch) ---- */
.patch{
  background:var(--surface);
  border-radius:var(--radius);
  border:1px solid var(--line);
  padding:22px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}
.patch > h2{
  font-size:16px; color:var(--ink); margin-bottom:16px; font-weight:800;
  display:flex; align-items:center; gap:8px;
}

/* ---- buttons ---- */
button{
  font-family:'Tajawal',sans-serif; font-weight:700; cursor:pointer;
  border:none; border-radius:11px; padding:11px 18px; font-size:14px;
  transition:transform .1s ease, box-shadow .15s ease, background .15s ease, opacity .15s;
}
button:active{transform:translateY(1px);}
.btn-primary{background:var(--crimson); color:#fff; box-shadow:0 4px 12px rgba(193,39,45,.22);}
.btn-primary:hover{background:#a91f26;}
.btn-secondary{background:var(--surface); color:var(--ink); border:1px solid var(--line-strong);}
.btn-secondary:hover{background:#f7f8fa;}
.btn-danger{background:#fff; color:var(--danger); border:1px solid #f0c9c9;}
.btn-danger:hover{background:#fdf2f2;}
.btn-ok{background:var(--ok); color:#fff; box-shadow:0 4px 12px rgba(31,157,87,.2);}
.btn-ok:hover{background:#188049;}
.btn-ghost{background:transparent; border:1px solid var(--line-strong); color:var(--ink-soft);}
.btn-ghost:hover{background:#f7f8fa; color:var(--ink);}
.btn-ember{background:var(--gold); color:#fff;}
.btn-ember:hover{background:#a2762a;}
button:disabled{opacity:.4; cursor:not-allowed;}
.row{display:flex; gap:10px; flex-wrap:wrap;}

/* ---- inputs ---- */
input,select,textarea{
  font-family:'Tajawal',sans-serif;
  background:var(--surface); color:var(--ink);
  border:1px solid var(--line-strong); border-radius:11px; padding:11px 13px; font-size:14px;
  width:100%; transition:border-color .15s, box-shadow .15s;
}
input:focus,select:focus,textarea:focus{
  outline:none; border-color:var(--crimson);
  box-shadow:0 0 0 3px rgba(193,39,45,.1);
}
input[type=color]{padding:4px; height:44px; cursor:pointer;}
label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; margin-top:12px; font-weight:600;}
.field{margin-bottom:6px;}

/* ---- role select / login ---- */
.center-screen{max-width:440px; margin:20px auto; text-align:center;}
.role-choice{display:grid; gap:16px; margin-top:10px;}
.role-choice .patch{cursor:pointer; text-align:right; transition:transform .12s, box-shadow .18s, border-color .18s; position:relative; overflow:hidden;}
.role-choice .patch::before{content:''; position:absolute; inset-inline-start:0; top:0; bottom:0; width:5px; background:var(--crimson);}
.role-choice .patch:nth-child(2)::before{background:var(--green);}
.role-choice .patch:hover{transform:translateY(-3px); box-shadow:var(--shadow-lift); border-color:var(--line-strong);}
.role-choice .patch h2{font-size:18px;}
.err{color:var(--danger); font-size:13px; margin-top:10px; min-height:16px; font-weight:600;}

/* ---- tabs ---- */
.tabs{display:flex; gap:7px; overflow-x:auto; margin-bottom:20px; padding:5px; background:var(--surface); border:1px solid var(--line); border-radius:15px; box-shadow:var(--shadow);}
.tab-btn{
  background:transparent; color:var(--ink-soft);
  white-space:nowrap; border:none; padding:9px 15px; border-radius:10px; font-size:13.5px;
}
.tab-btn:hover{background:#f4f5f7; color:var(--ink);}
.tab-btn.active{background:var(--crimson); color:#fff; box-shadow:0 3px 8px rgba(193,39,45,.24);}

/* ---- stats ---- */
.stats-row{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:18px;}
.stat-badge{
  background:var(--surface); color:var(--ink); border-radius:var(--radius);
  padding:22px 12px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  border:1px solid var(--line); box-shadow:var(--shadow); gap:4px;
}
.stat-badge b{font-size:30px; font-family:'Cairo',sans-serif; color:var(--crimson);}
.stat-badge:nth-child(2) b{color:var(--green);}
.stat-badge:nth-child(3) b{color:var(--gold);}
.stat-badge span{font-size:12px; font-weight:700; color:var(--ink-soft);}

/* ---- list rows ---- */
.list-row{
  display:flex; align-items:center; justify-content:space-between;
  background:#fafbfc; border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:9px;
  gap:10px; flex-wrap:wrap; transition:background .12s;
}
.list-row:hover{background:#f5f7f9;}
.list-row .name{font-weight:700;}
.pill{background:var(--green-soft); color:var(--green); border-radius:20px; padding:4px 11px; font-size:12px; font-weight:700;}
.avatar{
  width:42px; height:42px; border-radius:13px; background:var(--gold-soft);
  display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--gold);
  flex-shrink:0; overflow:hidden; font-family:'Cairo',sans-serif;
}
.avatar img{width:100%; height:100%; object-fit:cover;}
.rank-1{color:var(--gold); font-weight:800;} .rank-2{color:#8a94a6; font-weight:800;} .rank-3{color:#c08457; font-weight:800;}

/* ---- chips ---- */
.chip-group{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
.chip{
  background:#f4f5f7; color:var(--ink-soft); border-radius:20px;
  padding:9px 15px; font-size:13px; cursor:pointer; border:1.5px solid transparent; transition:all .12s;
}
.chip:hover{background:#eceef1;}
.chip.selected{border-color:var(--crimson); background:#fdeeef; color:var(--crimson); font-weight:700;}
.chip-amt{
  background:#f4f5f7; color:var(--ink); border-radius:11px; padding:9px 16px;
  cursor:pointer; font-weight:800; border:1.5px solid transparent; transition:all .12s;
}
.chip-amt:hover{background:#eceef1;}
.chip-amt.selected{border-color:var(--crimson); background:var(--crimson); color:#fff;}

.checklist{max-height:230px; overflow-y:auto; background:#fafbfc; border:1px solid var(--line); border-radius:var(--radius-sm); padding:8px;}
.check-item{display:flex; align-items:center; gap:9px; padding:8px 6px; font-size:14px; border-bottom:1px solid var(--line);}
.check-item:last-child{border-bottom:none;}
.check-item input[type=checkbox]{width:auto; accent-color:var(--crimson);}

table{width:100%; border-collapse:collapse; font-size:13px;}
th,td{padding:10px 8px; text-align:right; border-bottom:1px solid var(--line);}
th{color:var(--ink-soft); font-weight:700; font-size:12px;}

.top-search{max-width:520px; margin:0 auto 22px;}
.top-search input{padding:14px 16px; font-size:15px; box-shadow:var(--shadow); border-color:var(--line);}
.footnote{text-align:center; color:var(--ink-faint); font-size:12px; margin-top:24px;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media(max-width:640px){.two-col{grid-template-columns:1fr;} .topbar h1{font-size:23px;}}
.small-note{font-size:12.5px; color:var(--ink-soft); margin-top:6px; line-height:1.7;}
.divider{border:none; border-top:1px solid var(--line); margin:16px 0;}
.badge-total{color:var(--crimson); font-weight:800; font-family:'Cairo',sans-serif;}
.sync-dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-inline-start:6px;}
.sync-dot.on{background:var(--ok);} .sync-dot.off{background:var(--danger);}
.setup-box{max-width:660px; margin:40px auto; text-align:right;}
.setup-box code{background:#f4f5f7; padding:2px 6px; border-radius:5px; font-size:12px; color:var(--crimson);}
.setup-box pre{background:#1c2230; color:#e6e9ef; padding:14px; border-radius:12px; overflow-x:auto; font-size:12px; direction:ltr; text-align:left; margin-top:10px;}
.setup-box ol{padding-inline-start:20px; margin-top:8px; line-height:2.1;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ===================== STATE ===================== */
const ADMIN_CREDENTIALS = { username: "قائد", password: "كشاف2026" };
// غيّر اسم المستخدم وكلمة السر من هنا مباشرة قبل النشر.

// ⚠️ عبّي بيانات مشروع Firebase هون (من إعدادات المشروع على console.firebase.google.com)
const firebaseConfig = {
  apiKey: "AIzaSyAq17PlWfVLtS30CZHkT7HK7kDLTfpStQ8",
  authDomain: "test-39313.firebaseapp.com",
  projectId: "test-39313",
  storageBucket: "test-39313.firebasestorage.app",
  messagingSenderId: "339214243660",
  appId: "1:339214243660:web:86016d1d32daf4903fe1e9",
  measurementId: "G-NGSCYRJ2WS"
};
const FIREBASE_READY = !!firebaseConfig.apiKey && !!firebaseConfig.projectId;

let db = null;
let unsubs = [];

let state = {
  troopName: "مجموعة السنابل الكشفية",
  patrols: [],
  categories: [],
  students: [],
  log: [],
  week: 1,
  weekArchive: [],
  scoutOfWeek: null,
  matches: []
};
const DEFAULT_CATEGORIES = [
  { icon:"📅", label:"حضور والتزام" }, { icon:"🧭", label:"مهارات كشفية" },
  { icon:"🤝", label:"روح الفريق" }, { icon:"🎖️", label:"الزي والانضباط" },
  { icon:"🌟", label:"خدمة ومبادرة" }, { icon:"✏️", label:"أخرى" }
];
const DEFAULT_PATROLS = [
  { name:"سرب النسر", color:"#9e1b22" }, { name:"سرب الصقر", color:"#1f6b3a" }, { name:"سرب الذئب", color:"#20242a" }
];

function p(){ return Math.random().toString(36).slice(2,9); }
function fmtDate(d){ return new Date(d).toLocaleDateString('ar-EG',{day:'numeric',month:'short'}); }

let session = { isAdmin:false, tab:'home' };
let synced = false;

/* ===================== HELPERS ===================== */
function totalPoints(studentId){
  return state.log.filter(l=>l.studentId===studentId).reduce((s,l)=>s+l.amount,0);
}
function weekPoints(studentId){
  return state.log.filter(l=>l.studentId===studentId && l.week===state.week).reduce((s,l)=>s+l.amount,0);
}
function patrolTotal(patrolId){
  return state.students.filter(s=>s.patrolId===patrolId).reduce((s,st)=>s+totalPoints(st.id),0);
}
function patrolWeek(patrolId){
  return state.students.filter(s=>s.patrolId===patrolId).reduce((s,st)=>s+weekPoints(st.id),0);
}
function patrolName(id){ const pr=state.patrols.find(x=>x.id===id); return pr?pr.name:"—"; }
function studentName(id){ const s=state.students.find(x=>x.id===id); return s?s.name:"—"; }

/* ===================== RENDER ROOT ===================== */
function render(){
  const app = document.getElementById('app');
  if(!FIREBASE_READY){ app.innerHTML = setupNeededView(); return; }
  if(!synced){ app.innerHTML = loadingView(); return; }
  if(!session.isAdmin && session.tab!=='parent' && session.tab!=='login'){
    app.innerHTML = roleSelectView();
  } else if(session.tab==='login'){
    app.innerHTML = loginView();
  } else if(session.tab==='parent'){
    app.innerHTML = parentView();
  } else if(session.isAdmin){
    app.innerHTML = adminShell();
  }
  wireEvents();
}

function loadingView(){
  return `<div class="center-screen" style="margin-top:80px;"><div class="crest"><img src="logo.png" alt="شعار"></div><h2 style="color:var(--ink-soft); font-size:18px;">جارِ الاتصال بقاعدة البيانات…</h2></div>`;
}

function setupNeededView(){
  return `
  <div class="setup-box patch">
    <h2>⚙️ لسا ما ربطنا الموقع بقاعدة بيانات</h2>
    <p class="small-note">عشان التحديثات تنزل مباشرة لكل الأهالي والقادة، لازم تعبّي بيانات مشروع Firebase داخل ملف الصفحة.</p>
    <ol class="small-note">
      <li>افتح <code>https://console.firebase.google.com</code> وأنشئ مشروع جديد (مجاني).</li>
      <li>من القائمة الجانبية: Build → Firestore Database → Create database → اختر وضع <code>test mode</code>.</li>
      <li>من إعدادات المشروع ⚙️ → Your apps → أضف تطبيق ويب (</> ) وسمّه أي اسم.</li>
      <li>انسخ كائن <code>firebaseConfig</code> اللي بيظهرلك، وحطّه مكان الفارغ بأول ملف <code>index.html</code> بمتغير <code>firebaseConfig</code>.</li>
      <li>احفظ الملف وارفعه على GitHub Pages (أو أعد فتحه محلياً) — رح يشتغل مباشرة.</li>
    </ol>
    <pre>const firebaseConfig = {
  apiKey: "...",
  authDomain: "...",
  projectId: "...",
  storageBucket: "...",
  messagingSenderId: "...",
  appId: "..."
};</pre>
    <p class="small-note">⚠️ وضع <b>test mode</b> بفتح القراءة والكتابة لأي حد عنده رابط قاعدة البيانات لمدة 30 يوم فقط. قبل ما تخلص الفترة، بدك تضبط Firestore Rules (اسألني وقتها وبساعدك فيها).</p>
  </div>`;
}

/* ===================== ROLE SELECT ===================== */
function roleSelectView(){
  return `
  <div class="topbar">
    <div class="crest"><img src="logo.png" alt="شعار مجموعة السنابل الكشفية"></div>
    <h1>${state.troopName}</h1>
    <div class="sub">نظام نقاط الكشافة</div>
    <div class="sub-en">Al-Snabel Scouting Group</div>
  </div>
  <div class="center-screen">
    <div class="role-choice">
      <div class="patch" data-action="goLogin">
        <h2>🔐 دخول القادة</h2>
        <div class="small-note">لإدارة النقاط والأسراب والمباريات</div>
      </div>
      <div class="patch" data-action="goParent">
        <h2>👨‍👩‍👧 عرض النقاط لأهالي الكشافين</h2>
        <div class="small-note">شاهدوا نقاط وترتيب أبنائكم مباشرة</div>
      </div>
    </div>
  </div>`;
}

/* ===================== LOGIN ===================== */
function loginView(){
  return `
  <div class="topbar">
    <div class="crest"><img src="logo.png" alt="شعار مجموعة السنابل الكشفية"></div>
    <h1>دخول القادة</h1>
  </div>
  <div class="center-screen patch">
    <div class="field">
      <label>اسم القائد</label>
      <input id="loginUser" placeholder="اسم المستخدم">
    </div>
    <div class="field">
      <label>كلمة السر</label>
      <input id="loginPass" type="password" placeholder="كلمة السر">
    </div>
    <div class="err" id="loginErr"></div>
    <div class="row" style="justify-content:center; margin-top:10px;">
      <button class="btn-primary" data-action="doLogin">دخول</button>
      <button class="btn-ghost" data-action="backHome">رجوع</button>
    </div>
  </div>`;
}

/* ===================== ADMIN SHELL ===================== */
function adminShell(){
  const tabs = [
    ['home','🏠 الرئيسية'], ['points','⭐ نقاط'], ['students','👥 الكشافون'],
    ['patrols','🏅 الأسراب'], ['log','📋 السجل'], ['league','⚽ الدوري'], ['data','💾 نسخة']
  ];
  return `
  <div class="topbar">
    <div class="crest"><img src="logo.png" alt="شعار مجموعة السنابل الكشفية"></div>
    <h1>${state.troopName}</h1>
    <div class="sub">لوحة القادة</div>
    <div class="sub-en">Al-Snabel Scouting Group</div>
    <div class="row" style="justify-content:center; margin-top:10px;">
      <button class="btn-ghost" data-action="logout">🚪 خروج</button>
    </div>
  </div>
  <div class="tabs">
    ${tabs.map(([id,label])=>`<button class="tab-btn ${session.tab===id?'active':''}" data-action="setTab" data-tab="${id}">${label}</button>`).join('')}
  </div>
  <div id="tabContent">${tabContent()}</div>
  <div class="footnote">القيّم الحالي: ${ADMIN_CREDENTIALS.username} — الأسبوع ${state.week}</div>
  `;
}

function tabContent(){
  switch(session.tab){
    case 'points': return renderPoints();
    case 'students': return renderStudents();
    case 'patrols': return renderPatrols();
    case 'log': return renderLog();
    case 'league': return renderLeague();
    case 'data': return renderData();
    default: return renderHome();
  }
}

/* ===================== HOME ===================== */
function renderHome(){
  const totalPts = state.log.reduce((s,l)=>s+l.amount,0);
  const topStudents = [...state.students].sort((a,b)=>totalPoints(b.id)-totalPoints(a.id)).slice(0,5);
  const topPatrols = [...state.patrols].sort((a,b)=>patrolTotal(b.id)-patrolTotal(a.id));
  return `
  <div class="stats-row">
    <div class="stat-badge"><b>${state.students.length}</b><span>كشّاف</span></div>
    <div class="stat-badge"><b>${state.patrols.length}</b><span>سرب</span></div>
    <div class="stat-badge"><b>${totalPts}</b><span>نقطة</span></div>
  </div>

  <div class="patch">
    <h2>📅 الأسبوع الحالي: الأسبوع ${state.week}</h2>
    <button class="btn-ember" data-action="newWeek">🔄 بدء أسبوع جديد (أرشفة بدون فقد بيانات)</button>
  </div>

  <div class="two-col">
    <div class="patch">
      <h2>🥇 أعلى الكشافين نقاطاً</h2>
      ${topStudents.length? topStudents.map((s,i)=>`
        <div class="list-row">
          <div class="row" style="align-items:center;">
            <span class="rank-${i+1<=3?i+1:''}">#${i+1}</span>
            <div class="avatar">${avatarContent(s)}</div>
            <div><div class="name">${s.name}</div><div class="pill">${patrolName(s.patrolId)}</div></div>
          </div>
          <div class="badge-total">${totalPoints(s.id)} نقطة</div>
        </div>`).join('') : `<div class="small-note">لا يوجد كشافون بعد</div>`}
    </div>
    <div class="patch">
      <h2>🏅 ترتيب الأسراب</h2>
      ${topPatrols.length? topPatrols.map((pr,i)=>`
        <div class="list-row">
          <div class="row" style="align-items:center;">
            <span class="rank-${i+1<=3?i+1:''}">#${i+1}</span>
            <span style="width:14px;height:14px;border-radius:50%;background:${pr.color};display:inline-block;"></span>
            <div class="name">${pr.name}</div>
          </div>
          <div class="badge-total">${patrolTotal(pr.id)} نقطة</div>
        </div>`).join('') : `<div class="small-note">لا يوجد أسراب بعد</div>`}
    </div>
  </div>

  <div class="patch">

/* ===================== ACTIONS ===================== */
function wireEvents(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.onclick = (e)=>{
      const action = el.getAttribute('data-action');
      actions[action] && actions[action](el, e);
    };
  });
  const pi = document.getElementById('parentSearchInput');
  if(pi) pi.oninput = (e)=>{ parentSearch = e.target.value; render(); setCaretEnd('parentSearchInput'); };

  const lfP = document.getElementById('lf_patrol'); if(lfP) lfP.onchange=e=>{logFilter.patrol=e.target.value; render();};
  const lfS = document.getElementById('lf_student'); if(lfS) lfS.onchange=e=>{logFilter.student=e.target.value; render();};

  const pfPatrolFilter = document.getElementById('pf_patrolFilter');
  if(pfPatrolFilter) pfPatrolFilter.onchange = e=>{ pointsForm.patrolFilter=e.target.value; render(); };
  document.querySelectorAll('[data-bulk-student]').forEach(el=>{
    el.onchange = e=>{
      const id = el.getAttribute('data-bulk-student');
      if(e.target.checked) pointsForm.selectedStudents.add(id); else pointsForm.selectedStudents.delete(id);
    };
  });
  document.querySelectorAll('[data-cat]').forEach(el=>{
    el.onclick = ()=>{ pointsForm.categoryId = el.getAttribute('data-cat'); render(); };
  });
  document.querySelectorAll('[data-amt]').forEach(el=>{
    el.onclick = ()=>{ pointsForm.amount = Number(el.getAttribute('data-amt')); render(); };
  });
  document.querySelectorAll('[data-bulkamt]').forEach(el=>{
    el.onclick = ()=>{ pointsForm.bulkAmount = Number(el.getAttribute('data-bulkamt')); render(); };
  });
  const bulkPatrolSel = document.getElementById('pf_bulkPatrol');
  if(bulkPatrolSel) bulkPatrolSel.onchange = e=>{ pointsForm.bulkPatrol = e.target.value; };
  const mf1=document.getElementById('mf_t1'); if(mf1) mf1.onchange=e=>matchForm.t1=e.target.value;
  const mf2=document.getElementById('mf_t2'); if(mf2) mf2.onchange=e=>matchForm.t2=e.target.value;
  const mfd=document.getElementById('mf_date'); if(mfd) mfd.onchange=e=>matchForm.date=e.target.value;
  const mfst=document.getElementById('mf_status'); if(mfst) mfst.onchange=e=>{matchForm.status=e.target.value; render();};
  const mfs1=document.getElementById('mf_s1'); if(mfs1) mfs1.onchange=e=>matchForm.s1=Number(e.target.value);
  const mfs2=document.getElementById('mf_s2'); if(mfs2) mfs2.onchange=e=>matchForm.s2=Number(e.target.value);

  const impFile = document.getElementById('importFile');
  if(impFile) impFile.onchange = handleImportFile;
}
function setCaretEnd(id){ const el=document.getElementById(id); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length);} }

const actions = {
  goLogin: ()=>{ session.tab='login'; render(); },
  goParent: ()=>{ session.tab='parent'; render(); },
  backHome: ()=>{ session.isAdmin=false; session.tab='home'; render(); },
  doLogin: ()=>{
    const u = document.getElementById('loginUser').value.trim();
    const pw = document.getElementById('loginPass').value;
    if(u===ADMIN_CREDENTIALS.username && pw===ADMIN_CREDENTIALS.password){
      session.isAdmin=true; session.tab='home'; render();
    } else {
      document.getElementById('loginErr').textContent = 'اسم القائد أو كلمة السر غير صحيحة';
    }
  },
  logout: ()=>{ session.isAdmin=false; session.tab='home'; render(); },
  setTab: (el)=>{ session.tab = el.getAttribute('data-tab'); render(); },

  newWeek: async ()=>{
    if(!confirm('بدء أسبوع جديد؟ سيتم أرشفة الأسبوع الحالي دون فقد أي بيانات.')) return;
    const topS = [...state.students].sort((a,b)=>weekPoints(b.id)-weekPoints(a.id))[0];
    const topP = [...state.patrols].sort((a,b)=>patrolWeek(b.id)-patrolWeek(a.id))[0];
    await db.collection('weekArchive').add({ week:state.week, topStudent: topS?topS.name:null, topPatrol: topP?topP.name:null });
    await db.collection('meta').doc('app').set({ week: state.week+1 }, { merge:true });
  },
  setScoutOfWeek: async ()=>{
    const val = document.getElementById('scoutOfWeekSel').value || null;
    await db.collection('meta').doc('app').set({ scoutOfWeek: val }, { merge:true });
  },

  grantIndividual: ()=> applyIndividual(1),
  deductIndividual: ()=> applyIndividual(-1),
  grantBulk: ()=> applyBulk(1),
  grantPatrol: ()=> applyPatrolBulk(1),
  deductPatrol: ()=> applyPatrolBulk(-1),

  selectAllStudents: ()=>{ filteredStudentsForBulk().forEach(s=>pointsForm.selectedStudents.add(s.id)); render(); },
  clearAllStudents: ()=>{ pointsForm.selectedStudents.clear(); render(); },

  addStudent: async ()=>{
    const name = document.getElementById('ns_name').value.trim();
    if(!name) return alert('اكتب اسم الكشاف');
    const patrolId = document.getElementById('ns_patrol').value;
    const photo = document.getElementById('ns_photo').value.trim();
    await db.collection('students').add({ name, patrolId, photo });
    newStudent = { name:'', patrolId:'', photo:'' };
  },
  removeStudent: async (el)=>{
    const id = el.getAttribute('data-id');
    if(!confirm('حذف هذا الكشاف؟')) return;
    const batch = db.batch();
    batch.delete(db.collection('students').doc(id));
    const logsSnap = await db.collection('log').where('studentId','==',id).get();
    logsSnap.forEach(d=>batch.delete(d.ref));
    await batch.commit();
  },

  addPatrol: async ()=>{
    const name = document.getElementById('np_name').value.trim();
    if(!name) return alert('اكتب اسم السرب');
    const color = document.getElementById('np_color').value;
    await db.collection('patrols').add({ name, color });
    newPatrol = { name:'', color:'#c2542e' };
  },
  removePatrol: async (el)=>{
    const id = el.getAttribute('data-id');
    if(!confirm('حذف هذا السرب؟ سيصبح أعضاؤه بدون سرب.')) return;
    const batch = db.batch();
    batch.delete(db.collection('patrols').doc(id));
    const membersSnap = await db.collection('students').where('patrolId','==',id).get();
    membersSnap.forEach(d=>batch.update(d.ref, { patrolId:'' }));
    await batch.commit();
  },
  addCategory: async ()=>{
    const icon = document.getElementById('nc_icon').value.trim() || '⭐';
    const label = document.getElementById('nc_label').value.trim();
    if(!label) return alert('اكتب اسم الفئة');
    await db.collection('categories').add({ icon, label });
  },
  removeCategory: async (el)=>{
    const id = el.getAttribute('data-id');
    await db.collection('categories').doc(id).delete();
  },

  resetLogFilter: ()=>{ logFilter={patrol:'',student:''}; render(); },
  clearLog: async ()=>{
    if(!confirm('مسح كل السجل؟ لن يؤثر على المجاميع القديمة إلا بعد المسح.')) return;
    const snap = await db.collection('log').get();
    const batch = db.batch();
    snap.forEach(d=>batch.delete(d.ref));
    await batch.commit();
  },

  saveMatch: async ()=>{
    const t1 = document.getElementById('mf_t1').value;
    const t2 = document.getElementById('mf_t2').value;
    if(!t1 || !t2 || t1===t2) return alert('اختر سربين مختلفين');
    const status = document.getElementById('mf_status').value;
    const date = document.getElementById('mf_date').value;
    const s1 = status==='played'? Number(document.getElementById('mf_s1').value||0) : 0;
    const s2 = status==='played'? Number(document.getElementById('mf_s2').value||0) : 0;
    await db.collection('matches').add({ t1, t2, date, status, s1, s2 });
    matchForm = { t1:'', t2:'', date:'', status:'upcoming', s1:0, s2:0, goals:[] };
  },

  exportData: ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `نسخة-نقاط-الكشافة-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(url);
  },
  triggerImport: ()=>{ document.getElementById('importFile').click(); }
};

async function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!confirm('هذا رح يستبدل كل البيانات الحالية بقاعدة البيانات المباشرة بالنسخة المستوردة. متأكد؟')) return;
      const batch = db.batch();
      for(const col of ['patrols','categories','students','log','matches']){
        const snap = await db.collection(col).get();
        snap.forEach(d=>batch.delete(d.ref));
      }
      await batch.commit();
      const batch2 = db.batch();
      (data.patrols||[]).forEach(x=>{ const {id,...rest}=x; batch2.set(db.collection('patrols').doc(), rest); });
      (data.categories||[]).forEach(x=>{ const {id,...rest}=x; batch2.set(db.collection('categories').doc(), rest); });
      (data.students||[]).forEach(x=>{ const {id,...rest}=x; batch2.set(db.collection('students').doc(), rest); });
      (data.log||[]).forEach(x=>{ const {id,...rest}=x; batch2.set(db.collection('log').doc(), rest); });
      (data.matches||[]).forEach(x=>{ const {id,...rest}=x; batch2.set(db.collection('matches').doc(), rest); });
      await batch2.commit();
      await db.collection('meta').doc('app').set({ troopName:data.troopName, week:data.week||1, scoutOfWeek:data.scoutOfWeek||null }, { merge:true });
      alert('تم استيراد النسخة بنجاح');
    }catch(err){ console.error(err); alert('ملف غير صالح أو حدث خطأ بالاستيراد'); }
  };
  reader.readAsText(file);
}

async function applyIndividual(sign){
  const studentId = document.getElementById('pf_student').value;
  if(!studentId) return alert('اختر كشافاً');
  if(!pointsForm.categoryId) return alert('اختر فئة النشاط');
  const cat = state.categories.find(c=>c.id===pointsForm.categoryId);
  await db.collection('log').add({ studentId, categoryLabel:`${cat.icon} ${cat.label}`, amount: sign*pointsForm.amount, week: state.week, date: Date.now() });
}
async function applyBulk(sign){
  if(!pointsForm.categoryId) return alert('اختر فئة النشاط');
  if(pointsForm.selectedStudents.size===0) return alert('حدد كشافين على الأقل');
  const cat = state.categories.find(c=>c.id===pointsForm.categoryId);
  const batch = db.batch();
  pointsForm.selectedStudents.forEach(id=>{
    batch.set(db.collection('log').doc(), { studentId:id, categoryLabel:`${cat.icon} ${cat.label}`, amount: sign*pointsForm.amount, week: state.week, date: Date.now() });
  });
  await batch.commit();
  pointsForm.selectedStudents.clear();
  render();
}
async function applyPatrolBulk(sign){
  const patrolId = document.getElementById('pf_bulkPatrol').value;
  if(!patrolId) return alert('اختر السرب');
  const members = state.students.filter(s=>s.patrolId===patrolId);
  if(members.length===0) return alert('هذا السرب لا يوجد فيه أعضاء');
  const batch = db.batch();
  members.forEach(s=>{
    batch.set(db.collection('log').doc(), { studentId:s.id, categoryLabel:'🏅 نقاط سرب', amount: sign*pointsForm.bulkAmount, week: state.week, date: Date.now() });
  });
  await batch.commit();
}

/* ===================== FIREBASE SYNC ===================== */
async function seedDefaultsIfEmpty(){
  const patrolsSnap = await db.collection('patrols').get();
  if(patrolsSnap.empty){
    const batch = db.batch();
    DEFAULT_PATROLS.forEach(x=>batch.set(db.collection('patrols').doc(), x));
    await batch.commit();
  }
  const catsSnap = await db.collection('categories').get();
  if(catsSnap.empty){
    const batch = db.batch();
    DEFAULT_CATEGORIES.forEach(x=>batch.set(db.collection('categories').doc(), x));
    await batch.commit();
  }
  const metaSnap = await db.collection('meta').doc('app').get();
  if(!metaSnap.exists){
    await db.collection('meta').doc('app').set({ troopName: state.troopName, week: 1, scoutOfWeek: null });
  }
}

function listenCollection(name, targetKey){
  return db.collection(name).onSnapshot(snap=>{
    state[targetKey] = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    render();
  }, err=>console.error(name, err));
}

async function initFirebase(){
  const app = firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  await seedDefaultsIfEmpty();

  unsubs.push(listenCollection('patrols','patrols'));
  unsubs.push(listenCollection('categories','categories'));
  unsubs.push(listenCollection('students','students'));
  unsubs.push(listenCollection('log','log'));
  unsubs.push(listenCollection('matches','matches'));
  unsubs.push(listenCollection('weekArchive','weekArchive'));

  unsubs.push(db.collection('meta').doc('app').onSnapshot(doc=>{
    const data = doc.data() || {};
    state.troopName = data.troopName || state.troopName;
    state.week = data.week || 1;
    state.scoutOfWeek = data.scoutOfWeek || null;
    synced = true;
    render();
  }, err=>console.error('meta', err)));
}

/* ===================== INIT ===================== */
if(FIREBASE_READY){ initFirebase(); }
render();
</script>
